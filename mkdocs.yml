site_name: BMS Digital Twin
site_description: Research-grade, AI-augmented Battery Management System digital twin.
repo_url: https://github.com/crakashp2905-hub/battery-management-system-digital-twin
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - The digital twin (central state): twin.md
  - Estimation & benchmarks: estimation.md
  - Validation (real data): validation.md
  - Safety case: safety_case.md
  - Firmware & SIL: firmware.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
