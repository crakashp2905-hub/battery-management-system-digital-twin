[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-digital-twin"
dynamic = ["version"]
description = "Research-grade, AI-augmented Battery Management System (BMS) digital twin for multi-cell Li-ion / solid-state packs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Akash Preetham", email = "crakashp2905@gmail.com" }]
keywords = [
    "battery", "bms", "digital-twin", "lithium-ion", "kalman-filter",
    "state-of-charge", "electric-vehicle", "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "filterpy>=1.4.5",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18", "matplotlib>=3.7"]
notebook = ["jupyter>=1.0", "nbformat>=5.9", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/crakashp2905-hub/battery-management-system-digital-twin"
Repository = "https://github.com/crakashp2905-hub/battery-management-system-digital-twin"

[tool.setuptools]
packages = ["bms"]

[tool.setuptools.dynamic]
version = { attr = "bms.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# The pure-NumPy LSTM uses single-letter gate names (i, f, o, g) by convention.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"bms/__init__.py" = ["F401"]   # intentional re-exports
"tests/*" = ["E501"]
